experiment:
  name: pb_cf_phonebook_1k_r4_example
  seed: 42

resources:
  gpus: [0]

output_base_dir: runs/pb_cf/examples

model:
  base_model_id: meta-llama/Llama-3.1-8B-Instruct
  lora_config:
    r: 4
    lora_alpha: 4
    target_modules: all-linear
    lora_dropout: 0.1
    bias: none
    task_type: CAUSAL_LM

dataset:
  name: phonebook
  data_file_path: data/pb_cf/phonebook_qa_1K.csv
  use_chat_template: true

training:
  method: ntp
  num_train_steps: 1500
  learning_rate: 5.0e-05
  batch_size: 8
  checkpoint_strategy:
    policy: none

evaluation:
  script: pb_cf/analysis/evaluate_checkpoints_llama.py
